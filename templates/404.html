{% extends 'base.html' %}
{% load static %}
{% block title %}
    Page Not Found — ShopExpress
{% endblock %}
{% block content %}
    <div class="error-page">
        <div class="container">
            <div class="error-icon mb-3">
                <i class="bi bi-emoji-frown">
                </i>
            </div>
            <div class="error-code">
                404</div>
                <h2 class="fw-bold mb-2">
                    Page Not Found</h2>
                    <p class="text-muted mb-4">
                        The page you were looking for doesn't exist or has been moved.</p>
                        <a href="{% url 'home' %}" class="btn btn-primary btn-lg px-5">
                            <i class="bi bi-house-door me-2">
                            </i>
                            Back to Home        </a>
                        </div>
                    </div>
                {% endblock %}
