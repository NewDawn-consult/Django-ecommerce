{% extends 'base.html' %}
{% load static %}
{% block title %}
    Server Error — ShopExpress
{% endblock %}
{% block content %}
    <div class="error-page">
        <div class="container">
            <div class="error-icon mb-3">
                <i class="bi bi-gear">
                </i>
            </div>
            <div class="error-code">
                500</div>
                <h2 class="fw-bold mb-2">
                    Server Error</h2>
                    <p class="text-muted mb-4">
                        Something went wrong on our end. Please try again later.</p>
                        <a href="{% url 'home' %}" class="btn btn-primary btn-lg px-5">
                            <i class="bi bi-house-door me-2">
                            </i>
                            Back to Home        </a>
                        </div>
                    </div>
                {% endblock %}
