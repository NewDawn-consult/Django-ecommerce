{% extends 'base.html' %}
{% block title %}
    Password Reset Complete — ShopExpress
{% endblock %}
{% block content %}
    <div class="page-header">
        <div class="container">
            <h1>
                Password Reset Complete</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a href="{% url 'core:home' %}">
                                Home</a>
                            </li>
                            <li class="breadcrumb-item active">
                                Reset Complete</li>
                            </ol>
                        </nav>
                    </div>
                </div>
                <div class="container my-5">
                    <div class="row justify-content-center">
                        <div class="col-md-5">
                            <div class="card auth-card shadow-sm text-center">
                                <div class="card-body py-5">
                                    <div class="mb-4">
                                        <i class="bi bi-check-circle" style="font-size: 4rem; color: #198754;">
                                        </i>
                                    </div>
                                    <h4 class="fw-bold mb-3">
                                        Password Reset Successful</h4>
                                        <p class="text-secondary mb-4">
                                            Your password has been set. You can now log in with your new password.</p>
                                            <a href="{% url 'accounts:login' %}" class="btn btn-primary px-4">
                                                Log In</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        {% endblock %}
